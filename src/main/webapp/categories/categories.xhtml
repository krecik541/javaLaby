<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/templates/template.xhtml">

    <ui:define name="content">
        <f:event type="preRenderView" listener="#{authView.checkAuth}" />
        <h2>#{messages['categories.title']}</h2>

        <h:form id="categoryForm">

            <h:dataTable id="categoryTable" value="#{categoryView.categories}" var="cat" styleClass="table" headerClass="table-header" rowClasses="table-row">

                <h:column>
                    <f:facet name="header">#{messages['categories.header.name']}</f:facet>
                    <h:outputText value="#{cat.name}" />
                </h:column>
                <h:column>
                    <f:facet name="header">#{messages['categories.header.type']}</f:facet>
                    <h:outputText value="#{cat.type}" />
                </h:column>
                <h:column>
                    <f:facet name="header">#{messages['table.actions']}</f:facet>
                    <div style="display: flex; gap: 0.5rem;">
                        <h:link outcome="/categories/category-detail.xhtml" value="#{messages['actions.view']}" styleClass="action-link">
                            <f:param name="id" value="#{cat.id}"/>
                        </h:link>
                        <h:commandButton value="#{messages['actions.delete']}" action="#{categoryView.delete(cat.id)}" rendered="#{authView.admin}" styleClass="btn-delete">
                            <f:ajax execute="@this" render="categoryTable"/>
                        </h:commandButton>
                    </div>
                </h:column>
            </h:dataTable>
        </h:form>


    </ui:define>

</ui:composition>
